plugins {
    id 'com.android.library'
}

android {
    namespace 'com.bb10.bbui'
    compileSdk 35

    defaultConfig {
        minSdk 30
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
